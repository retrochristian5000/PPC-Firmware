name: mac-parts safety

on:
  push:
    branches:
      - "*"
    paths:
      - "packages/mac-parts.c"
      - "packages/mac-parts.h"
      - ".github/workflows/mac-parts-safety.yml"

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenBIOS
        uses: actions/checkout@v7

      - name: Reject unsafe fixed-width APM string handling
        run: |
          set -eu
          if grep -Eq 'strcmp\(par\.pmPartType|strcmp\(par\.pmProcessor|strlen\(par\.pmProcessor' packages/mac-parts.c; then
            echo 'error: mac-parts must not treat fixed-width APM fields as unbounded C strings' >&2
            exit 1
          fi

      - name: Require bounded selected-partition formatting
        run: |
          set -eu
          if grep -Eq 'sprintf\(tmpstr' packages/mac-parts.c; then
            echo 'error: selected-partition-args formatting must be bounded' >&2
            exit 1
          fi
          grep -q 'snprintf(tmpstr' packages/mac-parts.c

      - name: Require complete argument cleanup
        run: |
          set -eu
          grep -q 'free(parstr);' packages/mac-parts.c
          grep -q 'free(argstr);' packages/mac-parts.c
          grep -q 'free(str);' packages/mac-parts.c

      - name: Require partition-map I/O validation
        run: |
          set -eu
          grep -q 'if (SEEK( 0 ) != 0)' packages/mac-parts.c
          signature_checks=$(grep -c '__be16_to_cpu(par.pmSig) != DESC_PART_SIGNATURE' packages/mac-parts.c)
          if [ "$signature_checks" -lt 3 ]; then
            echo 'error: selected partition entries must be signature-validated after reread' >&2
            exit 1
          fi
