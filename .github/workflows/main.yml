name: Build OpenBIOS

on:
  push:
    branches:
      - "*"
    tags:
      - "!v*"

jobs:
  bootstrap-compiler-parity:
    runs-on: ubuntu-latest
    name: Compare GCC and Clang bootstrap outputs
    container:
      image: ghcr.io/retrochristian5000/ppc-firmware-builder:sha-ab8877c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout OpenBIOS
        uses: actions/checkout@v7

      - name: Install Clang
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang

      - name: Configure isolated PPC builds
        run: |
          mkdir parity-gcc parity-clang
          (cd parity-gcc && ../config/scripts/switch-arch qemu-ppc)
          (cd parity-clang && ../config/scripts/switch-arch qemu-ppc)

          for tree in parity-gcc parity-clang; do
            cat > "$tree/obj-ppc/forth/version.fs" <<'EOF'
          : builddate " compiler-parity" ;
          : version " compiler-parity" ;
          EOF
            cat > "$tree/obj-ppc/target/include/openbios-version.h" <<'EOF'
          #define OPENBIOS_BUILD_DATE "compiler-parity"
          #define OPENBIOS_VERSION_STR "compiler-parity"
          EOF
          done

      - name: Build dictionaries with GCC
        run: make -C parity-gcc/obj-ppc V=1 HOSTCC=gcc dictionaries

      - name: Build dictionaries with Clang
        run: make -C parity-clang/obj-ppc V=1 HOSTCC=clang dictionaries

      - name: Verify forthstrap output parity
        run: |
          set -eu
          gcc --version | head -1
          clang --version | head -1
          for dictionary in bootstrap.dict openbios-qemu.dict; do
            sha256sum \
              "parity-gcc/obj-ppc/$dictionary" \
              "parity-clang/obj-ppc/$dictionary"
            if ! cmp -s \
                "parity-gcc/obj-ppc/$dictionary" \
                "parity-clang/obj-ppc/$dictionary"; then
              echo "error: GCC and Clang produced different $dictionary" >&2
              cmp -l \
                "parity-gcc/obj-ppc/$dictionary" \
                "parity-clang/obj-ppc/$dictionary" | head -20 >&2 || true
              exit 1
            fi
          done

      - name: Checkout pinned project FCode utilities
        uses: actions/checkout@v7
        with:
          repository: retrochristian5000/fcode-utils
          ref: 30787afaf91005ceff69487059043cd676228ea9
          path: fcode-gcc
          persist-credentials: false

      - name: Prepare compiler-parity source copies
        run: |
          cp -a fcode-gcc fcode-clang
          for source in fcode-gcc/toke/tokzesc.c fcode-clang/toke/tokzesc.c; do
            sed -i 's/tic_param_t dummy_param;/tic_param_t dummy_param = { 0 };/' "$source"
            grep -q 'tic_param_t dummy_param = { 0 };' "$source"
          done

      - name: Build toke with GCC and Clang
        run: |
          make -C fcode-gcc/toke CC=gcc STRIP=true
          make -C fcode-clang/toke CC=clang STRIP=true

      - name: Verify toke output parity
        run: |
          set -eu
          fcode-gcc/toke/toke -o QEMU,VGA.gcc.bin drivers/vga.fs
          fcode-clang/toke/toke -o QEMU,VGA.clang.bin drivers/vga.fs
          sha256sum QEMU,VGA.gcc.bin QEMU,VGA.clang.bin
          if ! cmp -s QEMU,VGA.gcc.bin QEMU,VGA.clang.bin; then
            echo "error: GCC and Clang toke builds produced different FCode" >&2
            cmp -l QEMU,VGA.gcc.bin QEMU,VGA.clang.bin | head -20 >&2 || true
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    name: OpenBIOS build for amd64 ppc sparc32 sparc64 x86
    container:
      image: ghcr.io/retrochristian5000/ppc-firmware-builder:sha-ab8877c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout OpenBIOS
        uses: actions/checkout@v7

      - name: Backup Makefile.target
        run: cp Makefile.target Makefile.target.orig

      - name: Configure debug
        run: |
          sed 's#CFLAGS+= -Os#CFLAGS+= -O0#g' Makefile.target.orig > Makefile.target
          ./config/scripts/switch-arch amd64 ppc sparc32 sparc64 x86

      - name: Build debug
        run: make V=1

      - name: Move debug build
        run: mkdir -p debug && mv obj-* debug

      - name: Configure release
        run: |
          cp Makefile.target.orig Makefile.target
          ./config/scripts/switch-arch amd64 ppc sparc32 sparc64 x86

      - name: Build release
        run: make V=1

      - name: Move release build
        run: mkdir -p release && mv obj-* release

      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: openbios-multiarch-latest
          path: |
            debug/obj-x86/*.dict
            debug/obj-x86/openbios-builtin*
            debug/obj-x86/openbios.multiboot*
            debug/obj-x86/openbios-multiboot.syms
            debug/obj-x86/QEMU,VGA.bin
            debug/obj-amd64/openbios-unix
            debug/obj-amd64/*.dict
            debug/obj-ppc/*.dict
            debug/obj-ppc/openbios-qemu*
            debug/obj-ppc/QEMU,VGA.bin
            debug/obj-sparc32/*.dict
            debug/obj-sparc32/openbios-builtin*
            debug/obj-sparc32/QEMU,cgthree.bin
            debug/obj-sparc32/QEMU,tcx.bin
            debug/obj-sparc64/*.dict
            debug/obj-sparc64/openbios-builtin*
            debug/obj-sparc64/QEMU,VGA.bin
            release/obj-x86/*.dict
            release/obj-x86/openbios-builtin*
            release/obj-x86/openbios.multiboot*
            release/obj-x86/openbios-multiboot.syms
            release/obj-x86/QEMU,VGA.bin
            release/obj-amd64/openbios-unix
            release/obj-amd64/*.dict
            release/obj-ppc/*.dict
            release/obj-ppc/openbios-qemu*
            release/obj-ppc/QEMU,VGA.bin
            release/obj-sparc32/*.dict
            release/obj-sparc32/openbios-builtin*
            release/obj-sparc32/QEMU,cgthree.bin
            release/obj-sparc32/QEMU,tcx.bin
            release/obj-sparc64/*.dict
            release/obj-sparc64/openbios-builtin*
            release/obj-sparc64/QEMU,VGA.bin

      - name: Prepare pre-release from artifacts
        uses: actions/download-artifact@v8
        with:
          name: openbios-multiarch-latest
          path: archive

      - name: Archive pre-release
        run: cd archive && zip -r ../openbios-multiarch-latest.zip debug release

      - name: Upload pre-release (upstream repository only)
        if: ${{ github.repository_owner == 'openbios' }}
        uses: crowbarmaster/GH-Automatic-Releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: true
          automatic_release_tag: latest
          title: Development Build
          files: openbios-multiarch-latest.zip
