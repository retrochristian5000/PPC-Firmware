name: Compare toke compilers

on:
  push:
    branches:
      - "*"
    tags:
      - "!v*"

jobs:
  toke-compiler-parity:
    runs-on: ubuntu-latest
    name: Compare GCC and Clang toke output
    container:
      image: ghcr.io/openbios/openbios-builder:master
    steps:
      - name: Checkout OpenBIOS
        uses: actions/checkout@v7

      - name: Install Clang
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang

      - name: Fetch pinned FCode utilities
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/openbios/fcode-utils.git fcode-gcc
          git -C fcode-gcc fetch --depth=1 origin \
            6e563ee54aa9f60e538d90eedaa012ae77610344
          git -C fcode-gcc checkout --detach --force FETCH_HEAD
          cp -a fcode-gcc fcode-clang

      - name: Build toke with GCC
        run: make -C fcode-gcc/toke CC=gcc STRIP=true

      - name: Build toke with Clang
        run: make -C fcode-clang/toke CC=clang STRIP=true

      - name: Tokenize VGA FCode with both builds
        run: |
          fcode-gcc/toke/toke -o QEMU,VGA.gcc.bin drivers/vga.fs
          fcode-clang/toke/toke -o QEMU,VGA.clang.bin drivers/vga.fs

      - name: Verify toke output parity
        run: |
          set -eu
          gcc --version | head -1
          clang --version | head -1
          sha256sum QEMU,VGA.gcc.bin QEMU,VGA.clang.bin
          if ! cmp -s QEMU,VGA.gcc.bin QEMU,VGA.clang.bin; then
            echo "error: GCC and Clang toke builds produced different FCode" >&2
            cmp -l QEMU,VGA.gcc.bin QEMU,VGA.clang.bin | head -20 >&2 || true
            exit 1
          fi
