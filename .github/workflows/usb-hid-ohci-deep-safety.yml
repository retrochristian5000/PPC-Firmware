name: USB HID and OHCI deep safety

on:
  push:
    branches:
      - master
    paths:
      - 'Makefile'
      - 'drivers/usbhid.c'
      - 'drivers/usbohci.c'
      - 'drivers/usbohci_private.h'
      - '.github/workflows/usb-hid-ohci-deep-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-usb-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenBIOS
        uses: actions/checkout@v7

      - name: Check deeper HID and OHCI invariants
        shell: python
        run: |
          from pathlib import Path
          import re

          failures = []

          def section(text, start_marker, end_marker):
              start = text.index(start_marker)
              end = text.index(end_marker, start + len(start_marker))
              return text[start:end]

          hid = Path('drivers/usbhid.c').read_text()
          ohci = Path('drivers/usbohci.c').read_text()
          ohci_private = Path('drivers/usbohci_private.h').read_text()
          makefile = Path('Makefile').read_text()

          hid_event_type = section(hid, 'typedef union {', '} usb_hid_keyboard_event_t;')
          if 'u8 reserved;' not in hid_event_type or 'u8 repeats;' in hid_event_type:
              failures.append('HID boot report byte 1 must be treated as reserved, not repeat state')

          hid_poll = section(hid, 'static void\nusb_hid_poll', 'static int\nusb_hid_set_idle')
          if 'current.reserved = 0;' not in hid_poll:
              failures.append('HID must normalize the reserved boot-report byte before state comparison')
          if 'usb_hid_keyboard_rollover' not in hid_poll:
              failures.append('HID polling must detect and discard the six-slot ErrorRollOver phantom report')
          if 'memset(&HID_INST(dev)->previous' not in hid_poll:
              failures.append('HID rollover recovery must clear stale prior-key state')

          if '#define HID_KEYBOARD_ERROR_ROLLOVER' not in hid:
              failures.append('HID must name the Boot Keyboard ErrorRollOver usage')
          if not re.search(r'for \(i = 0; i < 6; \+\+i\)', hid) or 'HID_KEYBOARD_ERROR_ROLLOVER' not in hid:
              failures.append('HID ErrorRollOver detection must require all six key-array slots')

          hid_layout = section(hid, 'static int usb_hid_set_layout', '\nvoid\nusb_hid_init')
          if 'strcmp(' not in hid_layout or 'strncmp(' in hid_layout:
              failures.append('HID layout selection must use exact country-code matching')

          hid_init = section(hid, 'void\nusb_hid_init', 'static int usbhid_havechar')
          if 'keycount = 0;' in hid_init:
              failures.append('Attaching another HID keyboard must not erase the shared keyboard FIFO')
          if 'sizeof(usb_hid_keyboard_event_t)' not in hid_init or 'maxpacketsize' not in hid_init:
              failures.append('HID must reject interrupt endpoints too small for an 8-byte boot report')

          wait_ed = section(ohci, 'wait_for_ed(', 'static void\nohci_free_td_chain')
          free_ed = section(ohci, 'ohci_free_ed', 'static int\nohci_control')
          intr_destroy = section(ohci, 'static void\nohci_destroy_intr_queue', '/* read one intr-packet')
          for name, body in [('wait_for_ed', wait_ed), ('ohci_free_ed', free_ed),
                             ('ohci_destroy_intr_queue', intr_destroy)]:
              if re.search(r'&\s*~(?:0x)?3(?:U|UL)?\b', body):
                  failures.append(f'{name} must clear all four low TD address bits')

          done_queue = section(ohci, 'ohci_process_done_queue', 'int ob_usb_ohci_init')
          if re.search(r'^\s*int\s+i\s*,\s*j\s*;', done_queue, re.M):
              failures.append('OHCI done-queue debug counters must not exist unguarded in non-debug builds')
          if 'CONFIG_DEBUG_USB' not in done_queue:
              failures.append('OHCI done-queue accounting must be explicitly debug-only')

          dump_td = section(ohci, 'dump_td (td_t *cur)', 'static void\ndump_ed')
          if '(3UL << 8)' in dump_td:
              failures.append('OHCI TD diagnostics must not decode PID/direction from bits 8-9')
          if 'TD_DIRECTION_MASK' not in dump_td or 'TD_DIRECTION_SHIFT' not in dump_td:
              failures.append('OHCI TD diagnostics must use the named TD direction field')

          if '#define ED_SKIP' not in ohci_private:
              failures.append('OHCI must name the endpoint-descriptor Skip bit')
          if 'ED_SKIP' not in intr_destroy:
              failures.append('OHCI interrupt teardown must mark the ED skipped before unlinking it')
          if 'HccaFrameNumber' not in intr_destroy or '__le16_to_cpu' not in intr_destroy:
              failures.append('OHCI interrupt teardown must synchronize to the controller frame counter')
          if 'mdelay(1);' in intr_destroy:
              failures.append('OHCI interrupt teardown must not rely on a blind one-millisecond delay')
          if 'avoid freeing DMA-owned memory' not in intr_destroy:
              failures.append('OHCI frame-sync failure must preserve DMA-owned queue memory')

          init_fail = section(ohci, 'fail_periodic:', 'fail_hcca:')
          if 'free(periodic_ed);' in init_fail:
              failures.append('OHCI init cleanup must not discard the volatile qualifier when freeing periodic_ed')
          if 'free((void *)periodic_ed);' not in init_fail:
              failures.append('OHCI init cleanup must explicitly cast the volatile ED for free()')

          if re.search(r'(?<![A-Za-z0-9_])1\s*<<\s*31', ohci_private) or re.search(r'(?<![A-Za-z0-9_])1\s*<<\s*31', ohci):
              failures.append('OHCI bit 31 masks must never be formed by shifting signed int 1')
          if '#define MASK(startbit, lenbit) (((1U<<(lenbit))-1U)<<(startbit))' not in ohci_private:
              failures.append('OHCI generic mask construction must use unsigned arithmetic')
          if '#define MasterInterruptEnable (1U << 31)' not in ohci_private:
              failures.append('OHCI master interrupt enable must be a named unsigned bit')
          init = section(ohci, 'hci_t *\nohci_init', 'hci_t *\nohci_pci_init')
          if 'MasterInterruptEnable' not in init:
              failures.append('OHCI initialization must use the named master-interrupt bit')

          build_rule = section(makefile, 'build: start-build', '\n\nSUBDIR_RULES')
          if 'if ! $(MAKE) -C $$dir' not in build_rule or 'exit 1;' not in build_rule:
              failures.append('Top-level build must propagate any per-architecture make failure')
          if re.search(r'\|\|\s*\\\n\s*\(.*exit 1.*\)', build_rule, re.S):
              failures.append('Top-level build must not hide a failing sub-make inside a subshell and continue')

          if failures:
              for failure in failures:
                  print(f'FAIL: {failure}')
              raise SystemExit(1)

          print('Deep HID/OHCI safety invariants satisfied')
